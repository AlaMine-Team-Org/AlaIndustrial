modLoader = "javafml" #mandatory
loaderVersion = "${neoforge_loader_version_range}" #mandatory
license = "${license}"
[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${version}" #mandatory
displayName = "Ala Industrial" #mandatory
credits = "${credits}"
authors = "${mod_author}"
description = '''${description}''' #mandatory
# Icon in the NeoForge mod list (MOD-444). Root-relative jar path, the same asset the Fabric side
# ships in fabric.mod.json "icon". logoBlur=true: the icon is an anti-aliased render, not pixel
# art, and the list draws it scaled — linear filtering avoids jagged edges.
logoFile = "assets/alaindustrial/icon-128.png"
logoBlur = true
[[mixins]]
config = "${mod_id}.mixins.json"
[[mixins]]
config = "${mod_id}.worldgen.mixins.json"
[[mixins]]
config = "${mod_id}.compat-optional.mixins.json"
[[dependencies.${mod_id}]]
modId = "neoforge" #mandatory
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
