plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

repositories {
    // JEI (recipe viewer) optional compat for NeoForge.
    maven { url = 'https://maven.blamejared.com/' }
}

// MOD-242 — world-gametest lane moved out of `main` (it used to ship in the release jar).
// The `gametest` source set holds the NeoForge test glue (dev.alaindustrial.gametest.neoforge.*)
// and additionally compiles the shared scenario bodies from common/src/gametest/java (wired below).
// Declared before the neoForge block so `mods { ... sourceSet sourceSets.gametest }` can see it.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

neoForge {
    version = neoforge_version
    // Automatically enable NeoForge AccessTransformers if the file exists.
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify run config names with Fabric.
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file('runs/client'))
        }
        data {
            clientData()
            gameDirectory = this.mkdir(this.file('runs/data'))
            // "./gradlew :neoforge:runData"
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
            this.file('runs/server').createParentDirectories()
            gameDirectory = this.mkdir(this.file('runs/server'))
        }
        // MOD-022 — NeoForge world gametest lane. Boots a dedicated gameTestServer headless, which sets
        // ServerModLoader.isGameTestServer() -> GameTestHooks.isGametestEnabled(), so RegisterGameTestsEvent
        // fires and our world scenarios (dev.alaindustrial.gametest.neoforge.NeoForgeGameTests) run in a real
        // chunk-loaded world. enabledGameTestNamespaces = mod_id (configureEach above) scopes the run to our
        // tests. The task exits non-zero on any failure. Run: ./gradlew :neoforge:runGameTests
        gameTests {
            type = "gameTestServer"
            gameDirectory = this.mkdir(this.file('runs/gameTests'))
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        // MOD-322: the gametest source set is its OWN mod, mirroring Fabric's `alaindustrial-gametest`.
        // While it was a second sourceSet of `${mod_id}`, both roots collapsed into one union file
        // system per mod, so a test fixture at a path that also exists in common/src/main/resources
        // SHADOWED the real file instead of merging with it (there is no datapack merge inside one
        // mod). That silently replaced our own entries in `#c:ingots/tin` / `#c:ores/tin` and left
        // ForeignMaterialScenarios' cross-mod tag test green while it verified nothing. Two mods =
        // two packs = vanilla tag merging works again. See src/gametest/resources/META-INF/neoforge.mods.toml.
        //
        // The gametest CLASSES stay reachable exactly as before (same dev classpath), so the
        // reflective NeoForgeGameTestBootstrap lookup in IndustrializationNeoForge still resolves and
        // still registers on the `${mod_id}` mod bus. `jar` packs only `main`, so nothing here ships.
        "${mod_id}_gametest" {
            sourceSet sourceSets.gametest
        }
    }
    // MOD-022 feasibility spike: JUnit-in-server runtime tests (ModDevGradle unitTest).
    // Boots a headless MinecraftServer so the real NeoForge EnergyHandler adapter + capability
    // lookup can be exercised at runtime (not just compile/review verified).
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

dependencies {
    // JEI - optional dev/runtime recipe viewer. API only at compile time; full JEI only in dev runs.
    compileOnly "mezz.jei:jei-26.2-common-api:${jei_version}@jar"
    compileOnly "mezz.jei:jei-26.2-neoforge-api:${jei_version}@jar"
    runtimeOnly "mezz.jei:jei-26.2-neoforge:${jei_version}@jar"

    // net.neoforged:testframework provides EphemeralTestServerProvider (verified coordinate from the
    // neoforge userdev config.json `testLibraries`). Pulled from the NeoForged maven (settings.gradle).
    testImplementation "net.neoforged:testframework:${neoforge_version}"
    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // MOD-484 — the heap is set EXPLICITLY. Without this line Gradle's own default for `Test`
    // applies (`-Xmx512m`, measured on the live process: neither this file nor the generated
    // ModDevGradle `build/moddev/junit/vmArgs.txt` sets a heap). For a lane that boots a headless
    // `MinecraftServer` with every registry and datapack loaded, 512 MB is not a choice but an
    // oversight: `jcmd GC.heap_info` over 54 samples puts peak used heap at 301 MB, 59 % of that
    // default. Re-measure after adding test classes — the peak must stay clear of the ceiling, or
    // GC pressure turns into run-time variance.
    maxHeapSize = '1g'
}

// MOD-242 — compile the shared scenario bodies (common/src/gametest/java) into the gametest
// source set, mirroring the fabric side. Same source-dir-artifact mechanism as commonJava in
// multiloader-loader.gradle, but scoped so the scenarios never reach `main`/the shipped jar.
configurations {
    commonGametestJava {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    commonGametestJava(project(path: ':common', configuration: 'commonGametestJava'))
}

tasks.named('compileGametestJava', JavaCompile) {
    dependsOn(configurations.commonGametestJava)
    source(configurations.commonGametestJava)
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Implement mcgradleconventions loader attribute.
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}
