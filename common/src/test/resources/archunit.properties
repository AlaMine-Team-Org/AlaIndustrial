# MOD-715 / ADR-039: the frozen baseline of ArchitectureRules.coreDoesNotDependOnBlocksOrRegistry.
# Relative to the test task's working directory, which is the common/ project directory.
freeze.store.default.path=src/test/archunit-store
# A missing store is an error, never silently recreated.
freeze.store.default.allowStoreCreation=false
# A fixed violation fails the rule until the baseline is shrunk on purpose with
# -Darchunit.freeze.store.default.allowStoreUpdate=true (see the rule's javadoc): the ratchet only moves down.
freeze.store.default.allowStoreUpdate=false
