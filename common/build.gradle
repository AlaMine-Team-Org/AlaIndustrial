plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
    id 'jacoco'
    // Mutation testing (MOD: test-quality-mutation-pitest). PIT mutates the compiled bytecode of
    // the loader-neutral core (e.g. flips + to - inside the cable-loss formula) and re-runs the
    // L1 JUnit suite to check whether the existing assertions actually catch the regression.
    // Plugin + JUnit5 plugin versions verified 2026-07-17 against the Gradle Plugin Portal and
    // Maven Central (gradle-pitest-plugin 1.19.0, pitest-junit5-plugin 1.2.3, default PIT core
    // 1.22.1). Runs only against `common/` — this subproject has no Minecraft jar on its test
    // classpath (the moddev `neoFormVersion` line only pulls mappings metadata), so PIT sees a
    // plain Java library layout and none of the Loom/MC classpath failure modes apply.
    alias(libs.plugins.pitest)
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists.
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

dependencies {
    // Fabric and NeoForge both bundle Fabric Mixin, so it is safe to use in common.
    // Version cross-checked against both loaders' gradle.properties (MOD-022):
    //   https://github.com/neoforged/NeoForge/blob/26.2.x/gradle.properties
    //   https://github.com/FabricMC/fabric-loader/blob/master/gradle.properties
    compileOnly(libs.sponge.mixin)
    // Fabric and NeoForge both bundle MixinExtras. NeoForge 26.2 bundles 0.5.4;
    // aligned up from the template's 0.5.3 (MOD-022).
    // Declared twice on purpose: the catalog accessor is a Provider, and the nested
    // `compileOnly(annotationProcessor(...))` form only accepts a plain notation.
    compileOnly(libs.mixinextras.common)
    annotationProcessor(libs.mixinextras.common)

    // L1 unit tests (docs/testing/AUTOMATION-STANDARDS.md).
    testImplementation("org.junit.jupiter:junit-jupiter:${junit_version}")
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
    // Property-based testing (jqwik 1.9.3, MOD-pitest-coverage). Generative @Property tests produce
    // hundreds of randomised inputs per invariant — they catch mutants that point tests miss (e.g. a
    // `min→max` flip only fails on inputs where the two args differ; jqwik's arbitraries guarantee
    // such inputs are tried). Auto-discovered by the JUnit Platform via junit-platform-launcher above.
    //
    // VERSION PIN: deliberately 1.9.3, NOT 1.10.x. jqwik 1.10.0 (2026-05-25) and 1.10.1 contain
    // protestware: a hidden payload (obfuscated via ANSI escape sequences) inside the test executor
    // that injects destructive instructions into automated tooling reading the test output. Any
    // pipeline that parses this project's test output is therefore exposed on 1.10.x. 1.9.3
    // is the last clean release before the protestware (verified 2026-07-19 against Maven Central +
    // jqwik release notes; compatible with our JUnit Platform 1.10.2 since jqwik ≥1.9.0 requires only
    // Platform ≥1.7.0). DO NOT upgrade above 1.9.x without auditing the source for injection payloads.
    testImplementation(libs.jqwik)
    // Architecture rules (common/src/test/java/dev/alaindustrial/arch/). They read the COMPILED
    // bytecode of common/, so they see the real dependency graph rather than text: a grep for
    // `net.fabricmc` would miss a transitive edge and would flag the same string inside a javadoc
    // block. ArchUnit's own JUnit engine discovers the rules class by its @AnalyzeClasses annotation,
    // so the class needs no `Test` suffix — which conveniently also keeps it out of the pitest
    // mutation run (targetTests = dev.alaindustrial.*Test).
    testImplementation(libs.archunit.junit5)
    // Config lives in common and its config-file load/write (Config.loadFrom) references Gson, so
    // linking Config on the L1 test classpath needs Gson at runtime even though the balance tests
    // only read static fields. Gson is a transitive of Minecraft (MC 26.2 bundles 2.14.0); the L1
    // suite runs without the Minecraft jar, so pin it explicitly here (MOD-022 Phase 1).
    testRuntimeOnly(libs.gson)
    // Config.loadFrom logs via Industrialization.LOGGER (SLF4J). Exercising loadFrom in the L1 suite
    // (MOD-100 config file tests) loads Industrialization, so SLF4J must be on the test classpath; like
    // Gson it is a Minecraft transitive absent from the MC-free L1 run, so pin it explicitly.
    testRuntimeOnly(libs.slf4j.api)
    testRuntimeOnly(libs.slf4j.nop)
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // MOD-434 — deliberately NO maxParallelForks and NO reduced jqwik tries. Both were measured on
    // 2026-08-17 (numbers in the task log): the whole L1 run is only a few seconds of execution, about
    // half of it the single ArchitectureRules class import that no fork can split, and the six jqwik
    // classes together are ~1.5 s at 1000 tries. Two forks were within run-to-run noise, cpus/2 = 6
    // forks were SLOWER (six JVM starts, each instrumented by JaCoCo, competing for the box). Do not
    // read the per-class times in build/test-results/test/*.xml as evidence to the contrary: a jqwik
    // class run alone takes well under a second, but in the full run its XML `time` stretches from
    // its start into the Jupiter phase, so the per-class times overlap and their sum overstates the
    // wall time several times over. Wall time is the task time in `--profile` (or the span of the
    // XML `timestamp`s), never the sum.
    // JaCoCo coverage for the L1 unit suite. The report lands at
    // common/build/reports/jacoco/test/html/index.html — open it in a browser to see per-class line
    // coverage of core/ + Config (the loader-neutral logic the L1 tests target). Only the L1 JUnit
    // run is instrumented: the L2 world gametests run on the loader's own server process (Fabric Loom /
    // NeoForge moddev), where a JaCoCo agent would need separate wiring and risks interfering with the
    // game's classpath — out of scope for this initial coverage surface. MOD-090-style follow-up if
    // loader-process coverage is ever wanted.
    finalizedBy 'jacocoTestReport'
}

jacocoTestReport {
    // Only report on the mod's own classes — the L1 suite pulls in Minecraft-free pure logic, so
    // excluding third-party/neoforge-injected packages keeps the number meaningful.
    classDirectories.setFrom(classDirectories.files.collect {
        fileTree(dir: it, exclude: [
                '**/mixin/**',          // mixin hooks — exercised by the loader, not unit tests
                '**/*Mixin.class'
        ])
    })
    reports {
        xml.required = true   // CI/consumers
        html.required = true  // human review
    }
}

pitest {
    // JUnit 5 platform wiring — `junit5PluginVersion` both adds the pitest-junit5-plugin
    // dependency and sets testPlugin = "junit5".
    junit5PluginVersion = libs.versions.pitest.junit5.get()

    // Override the plugin's default PIT core (1.22.1) up to 1.25.7 — its ASM 9.10.1 reads Java 25
    // bytecode (class file 69) cleanly. On JDK 25 the 1.22.1 default's coverage minion exited
    // abnormally during `InstrumentationImpl.transform` (a classfile-version-read symptom); 1.25.7
    // is the current Central release (2026-07-08) and is confirmed to support Java 25/26 upstream
    // (hcoles/pitest#1439). gradle-pitest-plugin 1.19.0 drives it transparently via this property.
    pitestVersion = libs.versions.pitest.core.get()

    // Scope mutations to the code the L1 suite can actually reach. The default "${project.group}.*"
    // would also pull in client/mixin/menu packages whose behaviour is only exercised by L2 gametests
    // and that depend on the Minecraft jar — not unit-testable. The `excludedClasses` list below drops
    // the classes that nonetheless reference `net.minecraft.*` types: `common/` has NO Minecraft jar on
    // its test classpath by design (moddev only pulls NeoForm mappings metadata), so PIT's coverage
    // minion cannot resolve those types while computing stack-map frames and crashes with
    // "Could not find class definition for net/minecraft/...". The excluded classes are the
    // Level/BlockPos/Direction/Fluid/StringRepresentable-coupled ones (EnergyNetwork, EnergyNet,
    // NetworkManager, ItemNetwork, SolarSky, PipeFaceMode, FluidHolder, ...); their behaviour is
    // covered by the Fabric L2 @GameTest + NeoForge world-scenario suites instead. These belong to
    // a future NeoForge L1.5 pitest lane (which DOES have the MC jar), tracked separately.
    //
    // MOD-200 — glob semantics, verified, NOT folklore. PIT compiles `*` to the regex `.*`
    // (org.pitest.util.Glob#convertGlobToRegex, case '*', confirmed by javap on pitest-1.25.7.jar), and
    // `.*` MATCHES DOTS. So `dev.alaindustrial.core.*` already covers every sub-package —
    // `core.machine.ComponentWear` was being mutated all along. The per-sub-package entries that used to
    // sit here (`core.energy.*`, `core.fluid.*`, ...) were pure redundancy born of the opposite belief;
    // they are dropped. Only `**.` means "zero or more packages" as a distinct marker — plain `*` is
    // already greedy across dots. Do not "restore" the sub-package list: `core.*` is complete, and
    // `pitest_check.py --targets` now proves it on every run.
    //
    // The explicit non-core entries below are the ONLY MC-free classes outside `core/` (six of them,
    // enumerated by pitest_check.py --targets). They carry real L1 suites — LevelMathTest,
    // XpDerivationTest, GuidePaginatorTest, HudSmootherTest, TemperedGearRollTest — that PIT never ran
    // before MOD-200, because no glob here reached them. Listing them by FQCN rather than by package
    // glob keeps their ~50 MC-coupled package siblings out without a matching wall of exclusions.
    targetClasses = ['dev.alaindustrial.core.*',
                     'dev.alaindustrial.stats.LevelMath',
                     'dev.alaindustrial.client.guide.GuidePaginator',
                     'dev.alaindustrial.client.hud.HudSmoother',
                     'dev.alaindustrial.client.sound.HumTeleportDetector',
                     'dev.alaindustrial.entity.TemperedGearRoll',
                     // MOD-238 shipped the oil-lake sampling geometry Minecraft-free precisely so it
                     // could be unit-tested (OilLakeSamplesTest), then never added it here — the same
                     // "code added, list not updated" defect as the incubator trio below.
                     'dev.alaindustrial.worldgen.OilLakeSamples',
                     // MOD-248: the oil-deposit blob grid, Minecraft-free for the same reason and
                     // covered by OilLakeShapeTest. Added here with the class, not a release later.
                     'dev.alaindustrial.worldgen.OilLakeShape',
                     'dev.alaindustrial.item.material.TemperedIronToolStats',
                     'dev.alaindustrial.item.misc.TooltipKeys',
                     // MOD-315: the scythe's bonus-seed chance formula. Lifted out of the (nested,
                     // and therefore L1-unreachable) ScytheItem.Profile precisely so it could be
                     // unit-tested, so it is added here with the class rather than a release later.
                     // Its L1 suite is ScytheBonusTest.
                     'dev.alaindustrial.item.tool.ScytheBonus',
                     // MOD-247: the incubator's MC-free trio, added with MOD-118 (the dice) and
                     // MOD-234 (the status line) and never appended here — the same "code added,
                     // list not updated" defect MOD-200 filed the target gate for, only on the
                     // targetClasses side this time. All three are deliberately Minecraft-free
                     // (see MutationRoll's javadoc), so they belong in the run, not in
                     // excludedClasses. Their L1 suites are MutationRollTest + IncubatorStatusTest.
                     //
                     // The two entries above kept main's post-MOD-243 package paths: this change was
                     // branched before that split, and taking its side would have aimed pitest at
                     // dev.alaindustrial.item.* classes that no longer live there.
                     // MOD-468: the reactor room's status enum — MC-free by the same design as the
                     // status enums above, and added here WITH the class and its L1 suite
                     // (ReactorRoomStatusTest), not a release later.
                     'dev.alaindustrial.block.entity.ReactorRoomStatus',
                     // MOD-468 stage 3: the reason a reactor is idle. Same shape and same reason as
                     // the enum above — MC-free so the panel's diagnostics can be exercised by L1.
                     'dev.alaindustrial.block.entity.ReactorIdleReason',
                     'dev.alaindustrial.block.entity.IncubatorStatus',
                     'dev.alaindustrial.mutation.MutationGrade',
                     'dev.alaindustrial.mutation.MutationRoll',
                     // MOD-324: seven MC-free classes that no glob here reached, so their mutants were
                     // never counted at all — the `targetClasses` side of the same "code added, list not
                     // updated" defect as the incubator trio above. Four of them already carried a
                     // written L1 suite that PIT simply never ran (VulcanizerStatusTest,
                     // FluidOutputViewerModelTest, RecipeViewerLayoutTest, CraftingGridMappingTest); the
                     // other three (GalvanicBathStatus, GardenDroneStatus, GardenDroneAction) get their
                     // suites in this same change, because listing a class without a test is a
                     // deliberate step DOWN in kill rate.
                     //
                     // By FQCN, not by package glob, and that is load-bearing: `client.compat` holds
                     // five classes of which three (MachineRecipeViewerTargets, RecipeCategoryTitle,
                     // RecipeViewerInfo) are MC-coupled, and `recipe` holds nine of which eight
                     // implement Recipe<…>. A glob over either package would drag those in and
                     // manufacture exactly the guaranteed-NO_COVERAGE mutants this task is removing.
                     // MOD-251: the distillation column's status enum — MC-free by the same design
                     // as the four status enums above; added here WITH the class and its L1 suite
                     // (DistillationColumnStatusTest), not a release later.
                     // MOD-392: the overclock marker. Targeted like the port contracts and listed in
                     // NO_MUTABLE_BYTECODE next to them — a members-less interface cannot carry a
                     // mutant, but it must still be inside a glob so the day it grows a default method
                     // that method is mutated instead of silently uncounted.
                     'dev.alaindustrial.block.entity.Overclockable',
                     // MOD-439: the wind-mill readout contract (mode + rate) the shared T2 screen is
                     // written against. Same shape as Overclockable: a pure interface, targeted here and
                     // listed in NO_MUTABLE_BYTECODE, so a future default method is mutated, not lost.
                     'dev.alaindustrial.menu.WindMillReadout',
                     'dev.alaindustrial.block.entity.DistillationColumnStatus',
                     'dev.alaindustrial.block.entity.ElectricHeaterStatus',
                     'dev.alaindustrial.block.entity.GalvanicBathStatus',
                     'dev.alaindustrial.block.entity.GardenDroneAction',
                     'dev.alaindustrial.block.entity.GardenDroneStatus',
                     'dev.alaindustrial.block.entity.VulcanizerStatus',
                     // MOD-424: the centrifuge's status enum — MC-free like the six above, listed here
                     // WITH its L1 suite (ThermalCentrifugeStatusTest), not a release later.
                     'dev.alaindustrial.block.entity.ThermalCentrifugeStatus',
                     // MOD-458: the processing family's shared status enum — the first status enum in the
                     // mod that belongs to five machines rather than one. Listed WITH its L1 suite
                     // (ProcessingMachineStatusTest), same as the two above.
                     'dev.alaindustrial.block.entity.ProcessingMachineStatus',
                     'dev.alaindustrial.client.compat.FluidOutputViewerModel',
                     'dev.alaindustrial.client.compat.RecipeViewerLayout',
                     // MOD-125: the shared readout formatter (compact magnitudes, duration parts). Pure
                     // string/arithmetic work with no Minecraft on it, listed here WITH the class and
                     // its L1 suite (ReadoutFormatTest) rather than a release later.
                     'dev.alaindustrial.client.ReadoutFormat',
                     'dev.alaindustrial.recipe.CraftingGridMapping',
                     // MOD-064: the alloy smelter's order-independent slot assignment, lifted out of
                     // AlloyingRecipe precisely so it could be tested without Minecraft on the
                     // classpath. Added here with the class rather than a release later. Its L1 suite
                     // is AlloyMatchTest.
                     'dev.alaindustrial.recipe.AlloyMatch',
                     // MOD-204: Config's full L1 suite (ConfigFileTest + ConfigBalanceTest +
                     // ConfigSnapshotTest) now kills 157/157 mutants, so the class rejoins the
                     // mutation run on equal footing with the rest of the core. It is plain-Gson and
                     // Minecraft-free (MOD-100), so it belongs here rather than in excludedClasses.
                     'dev.alaindustrial.Config']
    // The MC-coupled classes are excluded from MUTATION (the bytecode PIT rewrites). But PIT's
    // JUnit discovery also walks every class under `targetTests` via reflection to find @Test
    // methods — and reflection on e.g. `EnergyNet` triggers `NoClassDefFoundError:
    // net/minecraft/world/level/Level` because the Minecraft jar is not on `common/`'s classpath.
    // So `targetTests` is pinned to ONLY the actual L1 test classes (the *Test suffix), keeping
    // discovery away from the MC-coupled main classes entirely. One glob is enough and cannot rot:
    // `*` spans dots (see the note above), and no class under `common/src/main` ends in `Test`, so
    // this reaches every L1 suite in every package — present and future — while still excluding
    // every main class by name. It replaces the per-package list that made MOD-200's suites
    // (HudSmootherTest, LevelMathTest, GuidePaginatorTest, TemperedGearRollTest) invisible to PIT.
    targetTests = ['dev.alaindustrial.*Test']
    excludedClasses = [
            // MOD-383: CanningRules answers "may this stack go in the machine", which means it reads
            // ItemStack / Items / DataComponents.FOOD — Minecraft types common's L1 classpath does not
            // have, so every mutant here would be a guaranteed NO_COVERAGE. The arithmetic it delegates
            // to (CanningMath) is deliberately Minecraft-free and stays IN the run, covered by
            // CanningMathTest; the predicate itself is covered by the L2 gametests instead.
            'dev.alaindustrial.core.food.CanningRules',
            // MOD-468: the reactor room's world adapter — it resolves BlockState/Level to ask
            // "what shell block stands here". The geometry it delegates to (RoomScan) is deliberately
            // Minecraft-free and stays IN the run, covered by RoomScanTest; this half is covered by the
            // L2 room scenarios instead.
            'dev.alaindustrial.core.structure.RoomValidator',
            'dev.alaindustrial.core.energy.EnergyLookup',
            'dev.alaindustrial.core.energy.DirectAdjacencyDistributor', // was EnergyNet (renamed MOD-168 #7)
            'dev.alaindustrial.core.energy.EnergyNetwork',
            'dev.alaindustrial.core.energy.EnergyPortHost',
            'dev.alaindustrial.core.fluid.FluidHolder',
            'dev.alaindustrial.core.fluid.FluidLookup',
            'dev.alaindustrial.core.fluid.FluidPortHost',
            'dev.alaindustrial.core.item.ItemLookup',
            'dev.alaindustrial.core.item.ItemNetwork',
            'dev.alaindustrial.core.item.ItemNetworkManager',
            'dev.alaindustrial.core.energy.NetworkManager',
            'dev.alaindustrial.core.item.PipeFaceMode',
            'dev.alaindustrial.core.environment.SolarSky',
            'dev.alaindustrial.core.environment.WindMillClearance',
            'dev.alaindustrial.core.environment.WindMillInterference',
            // Refactor pass round 2 (2026-07): three MC-coupled classes extracted from EnergyNetwork
            // (#7) + a new sky cache (#13). Same shape as the entries above — they reference
            // Level/BlockPos/Direction and cannot be instantiated in :common's MC-free pitest runtime.
            // Their behaviour is covered by :neoforge:test (L1.5 EnergyLineDistributorTest) and the
            // Fabric L2 gametests (NetworkGameTest, SolarPanelGameTest).
            'dev.alaindustrial.core.energy.EnergyTopologyCache',
            'dev.alaindustrial.core.energy.EnergyLineDistributor',
            'dev.alaindustrial.core.environment.SolarSkyCache',
            // Extracted from EnergyNetwork in the round-3 audit pass (#10): a read-only introspection
            // view that only delegates to the MC-coupled EnergyNetwork (List<BlockPos> accessors). Same
            // shape as the siblings above — no L1-testable bytecode of its own; excluded to keep the
            // ratchet floor free of its NO_COVERAGE mutations.
            'dev.alaindustrial.core.energy.EnergyNetworkDiagnostics',
            // MOD-144: four additional MC-coupled classes that previously showed as 59 NO_COVERAGE
            // mutations (37 FluidTank + 8 FluidMover + 8 GuideBookState + 6 GuideBookGiver). They have
            // ZERO L1-testable bytecode: their transfer/refund/codec flow is gated on types that
            // cannot be constructed in :common's MC-free test runtime. Excluded so the pitest kill rate
            // reflects only what the L1 suite CAN catch — and so the ratchet floor is a meaningful
            // signal of test-quality regressions, not a count of MC-only classes that gained a branch.
            //   - FluidTank: its insert/extract take a FluidHolder argument. FluidHolder's constructor
            //     wraps net.minecraft.world.level.material.Fluid (see FluidHolder.of(Fluid fluid) and
            //     the static EMPTY = new FluidHolder(Fluids.EMPTY)), so a tank cannot be exercised
            //     from L1. Its pure arithmetic was already extracted to TankMath (100% killed); what
            //     remains is the decision-flow (single-variant refusal, predicate gates, deferred
            //     fluid-clear) which requires a live FluidHolder. Behaviour is covered by Fabric L2
            //     FluidGameTest / FluidTankGameTest / GeothermalLavaInputGameTest.
            //   - FluidMover: same shape — its move() signature takes FluidPort + FluidHolder. The
            //     refund arithmetic was extracted to FluidMoverMath (100% killed); what remains is the
            //     null-guard / extract-then-insert control flow that needs live ports.
            //   - GuideBookState: extends net.minecraft SavedData + uses UUIDUtil codec — 4 direct
            //     net.minecraft imports, MC-only by construction.
            //   - guide.GuideBookGiver: mutates a player Inventory (net.minecraft.world.entity.player)
            //     and queries MinecraftServer — 4 direct net.minecraft imports, MC-only.
            // These belong to the future NeoForge L1.5 pitest lane (MOD-110 follow-up) which DOES have
            // the MC jar on its test classpath.
            'dev.alaindustrial.core.fluid.FluidTank',
            'dev.alaindustrial.core.fluid.FluidMover',
            'dev.alaindustrial.core.GuideBookState',
            'dev.alaindustrial.core.guide.GuideBookGiver',
            // MOD-200: three classes of exactly the same shape as the siblings above that were added
            // AFTER the last edit of this list and never appended to it (MOD-175 / MOD-179 / the pump
            // work). They are Level/BlockPos/Direction/FluidState-coupled, so the L1 suite cannot reach
            // a single line of them — they contributed 44 NO_COVERAGE mutations (23 + 7 + 14) and alone
            // dragged the gate from a passing rate down to 67.21 %, i.e. the mutation lane on `main` was
            // RED and stayed red. This is the real "code added, list not updated" defect MOD-200 was
            // filed for — the list that rotted was `excludedClasses`, not `targetClasses`.
            // Their behaviour is covered by the Fabric L2 water-mill/pump gametests.
            'dev.alaindustrial.core.environment.WaterMillInterference',
            'dev.alaindustrial.core.environment.WaterMillClearance',
            'dev.alaindustrial.core.fluid.FluidSourceFinder',
            // MOD-200: MC-coupled TRANSITIVELY, which the "does the file mention net.minecraft"
            // heuristic used for every entry above cannot see. PlayerStatsClientCache imports nothing
            // from Minecraft itself, but every one of its members is typed `PlayerModStats` — and THAT
            // is an MC-coupled record. Touching the cache from L1 loads it and dies on the MC types.
            // Listed here (rather than simply left out of targetClasses) so `pitest_check.py --targets`
            // sees a deliberate decision instead of a fresh blind spot and keeps passing.
            'dev.alaindustrial.stats.PlayerStatsClientCache',
            // MOD-324: four MC-coupled classes that arrived in MOD-258, MOD-151 and MOD-277 over six
            // days and were never appended here — 195 NO_COVERAGE mutations (20 WorldHeatSources +
            // 81 FluidNetwork + 64 FluidNetworkManager + 30 CropMaturity) that dropped the gate from
            // MOD-204's 88.25 % to 67.04 %. This is the SECOND time this exact drift has happened
            // (MOD-200 fixed it at 67.21 %), which is why MOD-324 also raised the target gate's
            // `uncovered_mc` finding from a warning to a [FAIL] and wired `pitest_check.py --targets`
            // into checkAll: the next occurrence now blocks the commit that causes it.
            //
            // Excluding them is not a way of dodging the bar — it is arithmetically forced. All 195
            // are detected="false" and none can ever be otherwise: :common has no Minecraft jar on its
            // test classpath by design, so the ceiling WITH these classes in the run is 703/898 =
            // 78.28 %, below the threshold of 80 even with perfect tests.
            //   - WorldHeatSources: a thin world-facing adapter (Level#getBlockState/getBlockEntity/
            //     getFluidState). Its MC-free half already lives in HeatSource, which is in the run.
            //     Same shape as WaterMillClearance/WindMillClearance above.
            //   - CropMaturity: every branch is an identity query about a block (state.is(tag),
            //     instanceof StemBlock/SweetBerryBushBlock, comparisons against Blocks.CACTUS), not a
            //     decision over numbers. Covered by the Fabric/NeoForge L2 scythe + garden-drone tests.
            //   - FluidNetwork / FluidNetworkManager: mirror the already-excluded EnergyNetwork and
            //     NetworkManager — ServerLevel/BlockPos/Direction throughout. The caveat this entry
            //     used to carry ("each still holds an extractable MC-free rule, worth ~29 mutants")
            //     has since been discharged, and by two different tasks:
            //       * MOD-401 replaced all three hand-written managers with one framework, so the
            //         round-robin tick cursor now lives in core.net.GraphNetworkManager — inside the
            //         `core.*` glob, mutated, and covered by GraphNetworkManagerTest. What is left of
            //         FluidNetworkManager is the ops adapter and three-line delegates.
            //       * MOD-333 moved the "move half the difference" anti-slosh rule (the gap, the
            //         `<= 1` threshold, the halving) and the intake-room test out of FluidNetwork into
            //         core.fluid.FluidFlowMath — likewise under the glob, covered by FluidFlowMathTest.
            //     Both classes STAY excluded: what remains of them is honestly MC-coupled, so putting
            //     them back in the run would only manufacture guaranteed-NO_COVERAGE mutants again.
            // Do NOT justify these with the "future NeoForge L1.5 pitest lane" the MOD-144 block above
            // mentions: MOD-110 phase 2 proved that lane impossible (FML's ClassLoadingGuardian
            // intercepts classloading) and deleted its config. These exclusions are permanent under the
            // current architecture, and their behaviour is covered by L2 gametests on both loaders.
            'dev.alaindustrial.core.crop.CropMaturity',
            'dev.alaindustrial.core.fluid.FluidNetwork',
            'dev.alaindustrial.core.fluid.FluidNetworkManager',
            'dev.alaindustrial.core.heat.WorldHeatSources',
            // NOTE: `dev.alaindustrial.Config` lived here as a deferred-coverage parking spot from
            // MOD-200 (135 mutants, only 35 killed) until MOD-204 wrote the full L1 suite
            // (ConfigSnapshotTest) that kills all 157 mutants. It has moved to `targetClasses` above
            // and out of `excludedClasses` + `DEFERRED_COVERAGE` — keeping it here would be a stale
            // blind spot the `pitest_check.py --targets` gate exists to catch.
    ]

    // Curated mutator set tuned for the math-heavy core (see docs/tasks/MOD-XXX for rationale).
    // Mutator/group names verified against the actual PIT 1.22.1 jar's constant pool
    // (org.pitest.mutationtest.engine.gregor.config.StandardMutatorGroups): the return-value
    // mutator is the GROUP `RETURNS` (NOT `RETURN_VALUES`/`RETURN_VALS`, which PIT rejects as
    // unknown). DEFAULT already bundles MATH+CONDITIONALS_BOUNDARY+INCREMENTS+INVERT_NEGS+
    // VOID_METHOD_CALLS+RETURNS; we list them explicitly so additions/removals are code-reviewed,
    // and add NEGATE_CONDITIONALS (inverted guards) on top.
    mutators = [
            'MATH',                   // a+b <-> a-b, a*b <-> a/b, a%b <-> a*b — broken-formula detector
            'CONDITIONALS_BOUNDARY',  // < <-> <= , > <-> >=      — off-by-one at tier/limit thresholds
            'INCREMENTS',             // i++ <-> i-- , += <-> -=   — accumulator/loop-direction errors
            'INVERT_NEGS',            // -a <-> a                  — sign flips in clamp/penalty math
            'NEGATE_CONDITIONALS',    // == <-> != , < <-> >=      — inverted safety guards
            'RETURNS',                // mutate returned value     — catches unasserted returns
            'VOID_METHOD_CALLS'       // drop a void method call   — catches unasserted side-effects
    ]

    // Stable report path (no per-run timestamped subdir) so CI can diff mutations.xml between runs
    // and the HTML drill-down lives at a predictable URL.
    outputFormats      = ['HTML', 'XML']
    timestampedReports = false

    // PIT spawns child JVMs to run mutated test classes — give them headroom and use a classpath
    // file (the default since gradle-pitest-plugin 1.19.0-rc.3) to avoid Windows cmdline limits.
    timeoutConstInMillis = 5000
    jvmArgs               = ['-Xmx2g']
    useClasspathFile      = true

    // No historyInputLocation/historyOutputLocation (MOD-431). OSS PIT 1.25.x has no incremental
    // history: pitest-entry-1.25.7.jar ships no HistoryFactory service, and with ANY history
    // location set SettingsFactory.createHistory() returns ErroringHistoryFactory, which throws
    // "History has been enabled but no history plugin has been installed/activated" (arcmutate
    // only) — verified by javap. The MOD-136 block that used to live here set both locations only
    // when the history file under common/build/ already existed; PIT never wrote that file, so the
    // block was dead and the matching actions/cache step in ci.yml never had anything to save.
    // Do not "fix" it by setting the locations unconditionally: that is the crash above.

    // NOTE: mutationThreshold/coverageThreshold are NOT set here. In gradle-pitest-plugin 1.19.0
    // the PIT-side `mutationThreshold` is only used for an early-exit heuristic, not a hard build
    // gate — the build can pass even with coverage below the floor. The real ratchet gate lives
    // in docs/tools/pitest_check.py (Python validator wired into the CI pitest job, NOT into
    // checkAll — pitest needs a prior :common:pitest run and is too slow for pre-commit). It reads
    // this task's mutations.xml and fails the build when the killed-mutant rate drops below
    // pitest_mutation_threshold in gradle.properties. MOD-136.
}

// MOD-242 — the world-gametest scenario bodies (dev.alaindustrial.gametest.*Scenarios +
// AlaGameTestHelper) live in their own `gametest` source set so they never reach the loaders'
// `main` source sets (and therefore never ship in the release jars — before this split every
// scenario class was compiled into BOTH release jars via the commonJava source-dir artifact).
// The set still compiles against the full main compile classpath + main classes, so the
// scenarios keep type-checking inside :common on every build.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
    }
    // MOD-362 — the visual-test toolkit (dev.alaindustrial.visual: pixel maths, missing-texture
    // detection, diff rendering) lives in `gametest` so it never ships, but it is pure Minecraft-free
    // logic and therefore MUST be unit-testable from L1. Without this line `common/src/test` cannot
    // see it and the toolkit would be the one piece of test infrastructure nobody tests — exactly the
    // "the ruler itself is unmeasured" gap MOD-362 closes. The dependency is one-way: gametest knows
    // nothing about test.
    test {
        compileClasspath += sourceSets.gametest.output
        runtimeClasspath += sourceSets.gametest.output
    }
}

// Keep the gametest sources type-checked by the ordinary :common lifecycle — without this,
// `./gradlew :common:build` would skip compileGametestJava and a broken scenario would only
// surface when a loader's gametest lane compiles it.
tasks.named('check') {
    dependsOn tasks.named('compileGametestJava')
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
    // MOD-242: source-dir artifact for the gametest scenarios, consumed ONLY by the loaders'
    // gametest source sets (fabric `gametest` via loom configureTests, neoforge `gametest`) —
    // never by their main compile, so the scenarios stay out of the shipped jars.
    commonGametestJava {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
    commonGametestJava sourceSets.gametest.java.sourceDirectories.singleFile
}

// Implement mcgradleconventions loader attribute.
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}
