plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

// MOD-399 — the sources and javadoc jars are only needed by a release publication, yet EVERY
// local build paid for them: `withJavadocJar()` hangs `javadoc` + `javadocJar` off `assemble` →
// `build`. Measured: `:common:javadoc --rerun-tasks` takes 21 seconds, for one subproject of three.
// Turn them on with a flag: `./gradlew build -PpublishArtifacts`.
boolean publishArtifacts = project.hasProperty('publishArtifacts')

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    // Called ALWAYS, not behind the flag. Besides the tasks, these two methods create the
    // consumable configurations `sourcesElements`/`javadocElements`, and common/build.gradle and
    // neoforge/build.gradle attach a loader attribute to them through `configurations.named(...)`,
    // which throws UnknownConfigurationException on a missing configuration at CONFIGURATION time.
    // "Do not create them" here would therefore mean not "no jar" but "the build never starts".
    withSourcesJar()
    withJavadocJar()
}

// So what is cut is execution, not registration: without the flag the tasks stay in the graph but
// are skipped (`SKIPPED`), and the 21-second `javadoc` leaves the ordinary build.
// `remapSourcesJar` (fabric-loom creates it next to `sourcesJar`) is silenced by the same list:
// otherwise it would go off remapping a jar nobody built.
if (!publishArtifacts) {
    tasks.matching { it.name in ['javadoc', 'javadocJar', 'sourcesJar', 'remapSourcesJar'] }
            .configureEach { it.enabled = false }
}

// MOD-498 — name the deprecated symbols instead of counting them. Without this every build ended
// with "Some input files use or override a deprecated API. Recompile with -Xlint:deprecation for
// details": the compiler knew what we were about to lose and we did not. Mojang and the loaders mark
// a symbol `@Deprecated` a release or two before removing it, so this is free advance notice of the
// next migration — MOD-495 is what the silence costs, where a removed class (JEI's
// ContainerScreenEvent$Render$Foreground) only surfaced at runtime, after the upgrade.
//
// `tasks.withType(JavaCompile)` and not `compileJava`: the flag has to reach all three subprojects
// (`common`, `fabric`, `neoforge` all apply this plugin — the loaders through `multiloader-loader`)
// AND every source set, tests and gametests included. A narrower rule ("main only") would be a
// hand-kept list that drifts the first time a source set is added; this one cannot.
//
// Deliberately NOT `-Werror`. Vanilla symbols are deprecated on Mojang's schedule, not ours, and a
// build that goes red because of somebody else's release would stop work at a moment we do not
// choose. The goal here is visibility, not a gate.
//
// Note the numbers this prints are warning LINES, not distinct defects: the loaders recompile the
// shared `common/` sources into their own jars, so one line of common code is reported up to three
// times — and NeoForge adds deprecations of its own on top of vanilla's, which is why its count is
// the highest of the three.
// `options.compilerArgs` and NOT the tidier `options.deprecation = true`, which produces the same
// javac flag but is annotated `@Console` in Gradle: it is not a task input, so it does not take part
// in the build-cache key. Measured here — with `options.deprecation = true` this very build came back
// `FROM-CACHE` for all eight compile tasks and printed NOTHING, reusing entries compiled before the
// flag existed. For a change whose entire product is console output that is the one failure mode
// that matters. `compilerArgs` is a real `@Input`: the entries recompile once when this line lands,
// and from then on a cache hit can only come from a compile that had the flag.
// `-Xmaxwarns` because javac prints at most 100 warnings per compilation by DEFAULT and then stops
// naming them — measured on a 150-call probe: it printed 100, replaced the rest with a single
// "Note: … has additional uses or overrides of a deprecated API", and reported "100 warnings", i.e.
// the count itself lied. That is precisely the failure this task exists to remove, so leaving the
// default would put the cap back one version bump from now: the worst lane here already carried 77
// warnings before this change (48 deprecation + 29 `[removal]`), and MOD-226 (Minecraft 26.3) is the
// kind of event that deprecates a lot at once. The number just has to be far out of reach.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:deprecation' << '-Xmaxwarns' << '2000'
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    // MOD-503 — the QA test stands (`/function alaindustrial:test/*`, docs/testing/IN-GAME-ENV.md)
    // are internal tooling for `alamod-test` sessions, yet they shipped in every public artifact:
    // 29 files, verified present in 0.1.109-0.1.118 here and recorded on 0.1.97-0.1.99 by MOD-294.
    //
    // They were not inert cargo, which is why this outranks its "packaging tidy-up" framing:
    // `/function` is open to any operator and tab-completes the whole list, and the set includes
    // `give_all` (68 `give` commands — the entire mod into the inventory) and `clear`
    // (`fill ~1 ~-1 ~-3 ~12 ~4 ~4 air`, i.e. 12x6x8 wiped at the player's feet), which every
    // `setup_*` stand starts with. In a player's own world that is a progression cheat and a
    // griefing primitive, not a test fixture.
    //
    // The filter sits on PACKAGING, not on `processResources`. That distinction is the whole fix:
    // both dev runs and the jar are fed by the same `main` resource output, so an exclude one step
    // earlier (in `processResources`, the obvious place) empties `build/resources/main` too and
    // kills the stands in `runClient` — i.e. `alamod-test` with them. `jar` is downstream of that
    // directory and is read by nobody but the release, so excluding here takes the files out of the
    // artifact while the dev classpath keeps them verbatim.
    //
    // `tasks.withType(Jar)` rather than `jar`: the rule is "no jar this build produces", which also
    // covers `sourcesJar` (published to maven under -PpublishArtifacts) and both loaders at once.
    // Fabric's `remapJar` needs no line of its own — it remaps `jar`'s archive, so it inherits an
    // input that is already clean.
    exclude "data/${mod_id}/function/test/**"
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

// Build stamp: short git hash + build timestamp, substituted into alaindustrial.build.json
// so /ala version prints real values instead of raw ${...} placeholders.
//
// MOD-399 — why the time is NOT taken from `new Date()`. Both values end up in
// `inputs.properties(expandProps)` at the bottom of this file, so changing either one makes
// `processResources` out of date and drags `jar` → `remapJar` → the gametests along with it. With
// `new Date().format('yyyy-MM-dd HH:mm')` incrementality lasted exactly until the minute rolled
// over (measured: two runs inside one minute are UP-TO-DATE, in different minutes they are not).
//
// Both values come from ONE git call: the short HEAD hash and the date of THAT commit. The commit
// date rather than the launch time, because the stamp has to be a function of the inputs and not of
// the clock: while HEAD has not moved the value is the same and the build stays incremental. It
// costs no extra invalidation — `githash` already changes on every commit, so the commit date
// travels with it in the same beat. A release may override it through the ALA_BUILD_TIME
// environment variable (the real build time).
//
// `ignoreExitValue` + try/catch cover a clean export without `.git` and a machine with no git on
// PATH: there 'dev' remains — exactly the fallback BuildInfo.git() expects. `providers.exec` rather
// than Groovy's `.execute()`: Gradle 9 removed `Project.exec`, and the same approach already works
// in gradle/checks.gradle. The date format deliberately carries no space — an argument with a space
// would need different escaping on Windows and *nix.
String gitHash = 'dev'
String commitTime = ''
try {
    def git = providers.exec {
        commandLine 'git', 'log', '-1', '--date=format:%Y-%m-%dT%H:%M', '--format=%h%n%cd'
        ignoreExitValue = true
    }
    if (git.result.get().exitValue == 0) {
        // Two lines: `%h` (the short hash) and `%cd` (the commit date in the given format).
        List<String> stamp = git.standardOutput.asText.get().trim().readLines()
        if (stamp.size() >= 1 && !stamp[0].trim().isEmpty()) {
            gitHash = stamp[0].trim()
        }
        if (stamp.size() >= 2) {
            commitTime = stamp[1].trim()
        }
    }
} catch (Exception e) {
    // git does not run on this machine — 'dev'/'' stay as they are. Say so: in a RELEASE build a
    // `git: dev` stamp means the artifact cannot be traced back to a commit, and until now the only
    // sign of that was the stamp itself. The paired BuildInfo.java already logs at runtime; this
    // closes the build-side half.
    logger.warn("[alaindustrial] could not read the git stamp ({}: {}) — the build will be marked "
            + "'dev' and will not carry a commit hash.", e.getClass().getSimpleName(), e.message)
}
String buildTime = System.getenv('ALA_BUILD_TIME')?.trim() ?: (commitTime ?: 'dev')

processResources {
    var expandProps = [
            'version'                      : version,
            'githash'                      : gitHash,
            'buildtime'                    : buildTime,
            'group'                        : project.group, // Else we target the task's group.
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'credits'                      : credits,
            'java_version'                 : java_version
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace('\n', '\\\\n') : value]
    }

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json', 'alaindustrial.build.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}

// Publication sits behind the flag too (MOD-399). `from components.java` pulls in the
// `sourcesElements`/`javadocElements` variants, i.e. publishes both the sources and the javadoc
// jar; without `-PpublishArtifacts` those tasks are disabled and the publication would point at
// files nobody built. One flag for both facts: "we build the publication artifacts" == "we publish
// them".
if (publishArtifacts) {
    publishing {
        publications {
            register('mavenJava', MavenPublication) {
                artifactId base.archivesName.get()
                from components.java
            }
        }
        repositories {
            maven {
                url System.getenv('local_maven_url')
            }
        }
    }
}
