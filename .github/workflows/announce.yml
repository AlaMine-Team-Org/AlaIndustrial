# Installed into the PUBLIC repo at: .github/workflows/announce.yml
#
# Posts ONE Discord announcement per mod version (MOD-647). A version ships as one tag per
# Minecraft line (vX.Y.Z-mc26.3, vX.Y.Z-mc26.2); a post per tag repeated the same news twice.
# The release skill runs this once, after every line of the version is verified on the
# marketplaces; release.yml no longer announces anything itself.
#
#   gh workflow run announce.yml -R AlaMine-Team-Org/AlaIndustrial -f version=X.Y.Z
name: Announce
run-name: Announce ${{ inputs.version }}${{ inputs.channel == 'news' && ' (news)' || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Mod version, e.g. 0.1.183 (every Minecraft line released under it), or one tag, e.g. v0.1.183-mc26.2'
        required: true
        type: string
      text:
        description: 'Optional custom message (Markdown). Empty = the changelogs of the release.'
        required: false
        type: string
      channel:
        description: 'Target Discord channel: releases (default) or news'
        required: false
        type: choice
        default: releases
        options:
          - releases
          - news
      force:
        description: 'Post again even though this version was already announced'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read   # the duplicate guard reads this workflow's earlier runs

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Self-test the post composer
        run: python .github/scripts/test-announcement.py

      - name: Refuse a second post for the same version
        if: ${{ !inputs.force && inputs.channel != 'news' && inputs.text == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          prior=$(gh run list -R "$GITHUB_REPOSITORY" --workflow announce.yml --status success --limit 100 \
            --json databaseId,displayTitle \
            --jq "[.[] | select(.displayTitle == \"Announce $VERSION_INPUT\" and .databaseId != $GITHUB_RUN_ID)] | length")
          if [ "$prior" != "0" ]; then
            echo "::error::$VERSION_INPUT was already announced ($prior earlier run). Re-run with force=true to post again."
            exit 1
          fi

      - name: Collect the release lines and compose the post
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$VERSION_INPUT" in
            v*) TAGS="$VERSION_INPUT"; VERSION="${VERSION_INPUT#v}"; VERSION="${VERSION%%-mc*}" ;;
            *)  VERSION="$VERSION_INPUT"
                TAGS=$(git ls-remote --tags origin "refs/tags/v${VERSION}-mc*" | awk '{print $2}' \
                       | { grep -v '\^{}$' || true; } | sed 's#refs/tags/##') ;;
          esac
          [ -n "$TAGS" ] || { echo "::error::no release tags found for $VERSION_INPUT"; exit 1; }
          ARGS=()
          for T in $TAGS; do
            # A tag without its GitHub Release means that line never finished publishing.
            gh release view "$T" -R "$GITHUB_REPOSITORY" >/dev/null \
              || { echo "::error::$T has no GitHub Release — announce after every line is published"; exit 1; }
            git fetch --quiet --depth 1 origin "refs/tags/$T:refs/tags/$T"
            git show "$T:CHANGELOG.md" > "changelog-$T.md"
            ARGS+=(--line "$T=changelog-$T.md")
          done
          python .github/scripts/compose-announcement.py --version "$VERSION" "${ARGS[@]}" --out post.json

          # Release media of the leading line; `discord.<ext>` wins over `changelog.<ext>` (a still
          # changelog image, or an animation that needs another container for Discord).
          MT=$(jq -r .media_tag post.json)
          MEDIA=""
          for name in $(git ls-tree --name-only "$MT" "release-media/$MT/" | sort -r); do
            base=$(basename "$name")
            case "${base,,}" in
              discord.png|discord.jpg|discord.jpeg|discord.webp|discord.gif|discord.mp4|discord.webm) MEDIA="$name"; break ;;
            esac
          done
          if [ -z "$MEDIA" ]; then
            for name in $(git ls-tree --name-only "$MT" "release-media/$MT/"); do
              base=$(basename "$name")
              case "${base,,}" in
                changelog.png|changelog.jpg|changelog.jpeg|changelog.webp|changelog.gif) MEDIA="$name"; break ;;
              esac
            done
          fi
          if [ -n "$MEDIA" ]; then
            git show "$MT:$MEDIA" > "media-$(basename "$MEDIA")"
            echo "MEDIA=media-$(basename "$MEDIA")" >> "$GITHUB_ENV"
          fi
          echo "MEDIA_TAG=$MT" >> "$GITHUB_ENV"

      - name: Announce on Discord
        env:
          DISCORD_RELEASES_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          DISCORD_NEWS_WEBHOOK: ${{ secrets.DISCORD_NEWS_WEBHOOK }}
          CUSTOM_TEXT: ${{ inputs.text || '' }}
          CHANNEL: ${{ inputs.channel || 'releases' }}
        run: |
          # Channel → webhook secret. A missing secret is an ERROR, never a quiet skip and never a
          # fallback into the other channel (a post landing in the wrong channel is the incident
          # this guards against).
          case "$CHANNEL" in
            releases) DISCORD_WEBHOOK="$DISCORD_RELEASES_WEBHOOK" ;;
            news)     DISCORD_WEBHOOK="$DISCORD_NEWS_WEBHOOK" ;;
            *) echo "::error::unknown channel '$CHANNEL' (expected releases or news)"; exit 1 ;;
          esac
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "::error::webhook secret for channel '$CHANNEL' is not set — nothing was posted"; exit 1
          fi

          DESC="$(jq -r .description post.json)"
          # Custom message mode: the exact post to send (Markdown), e.g. a short news item.
          [ -n "$CUSTOM_TEXT" ] && DESC="$CUSTOM_TEXT"
          ICON="https://raw.githubusercontent.com/AlaMine-Team-Org/AlaIndustrial/$MEDIA_TAG/common/src/main/resources/assets/alaindustrial/icon-128.png"
          NAME=""
          [ -n "${MEDIA:-}" ] && NAME="$(basename "$MEDIA")"
          payload="$(jq -n \
            --arg username "Ala Industrial" \
            --arg avatar "$ICON" \
            --arg title "$(jq -r .title post.json)" \
            --arg url "$(jq -r .url post.json)" \
            --arg desc "$DESC" \
            --arg dl "$(jq -r .downloads post.json)" \
            --arg name "$NAME" \
            '{
               username: $username,
               avatar_url: $avatar,
               embeds: [ (
                 { title: $title, url: $url, description: $desc, color: 12088115,
                   fields: [ { name: "⬇️ Downloads", value: $dl } ] }
                 + (if $name != "" then { image: { url: ("attachment://" + $name) } } else {} end)
               ) ]
             }')"

          # The payload reaches curl through a FILE, never inline. In `-F name=value` curl treats
          # `;` inside the value as the start of a field parameter (`;type=`, `;filename=`), so a
          # changelog containing a semicolon arrives at Discord as truncated JSON (HTTP 400).
          printf '%s' "$payload" > disc_payload.json

          if [ -n "${MEDIA:-}" ]; then
            echo "Attaching release media: $MEDIA ($(du -h "$MEDIA" | cut -f1))"
          else
            echo "::warning::no release media under release-media/$MEDIA_TAG — announcing text only"
          fi

          # Discord sits behind Cloudflare, which 403s (error 1010) requests with a
          # default library User-Agent — a descriptive UA is required (verified in test).
          # Content-Type is NOT set by hand here: curl must pick the multipart boundary itself.
          for attempt in 1 2 3; do
            if [ -n "${MEDIA:-}" ]; then
              code=$(curl -sS --connect-timeout 20 --max-time 120 -o disc_resp.json -w '%{http_code}' \
                -H "User-Agent: AlaIndustrial-Release/1.0 (+https://github.com/AlaMine-Team-Org/AlaIndustrial)" \
                -F "payload_json=<disc_payload.json;type=application/json" \
                -F "files[0]=@$MEDIA;filename=$NAME" \
                -X POST "$DISCORD_WEBHOOK")
            else
              code=$(curl -sS --connect-timeout 20 --max-time 60 -o disc_resp.json -w '%{http_code}' \
                -H "Content-Type: application/json" \
                -H "User-Agent: AlaIndustrial-Release/1.0 (+https://github.com/AlaMine-Team-Org/AlaIndustrial)" \
                -X POST "$DISCORD_WEBHOOK" -d "$payload")
            fi
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo "Discord announce OK (HTTP $code)"; exit 0
            fi
            echo "::warning::Discord announce attempt $attempt failed (HTTP $code); body:"; cat disc_resp.json || true
            if [ "$code" = "429" ]; then
              ra=$(jq -r '.retry_after // 3' disc_resp.json 2>/dev/null || echo 3); sleep "$ra"
            else
              sleep 5
            fi
          done
          # A dispatched announcement is the whole job: failing to post is a red run, so the
          # duplicate guard never counts it as done.
          echo "::error::Discord announce failed after 3 attempts (last HTTP $code)"
          exit 1
