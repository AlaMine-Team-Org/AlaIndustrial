# Installed into the PUBLIC repo at: .github/workflows/guard.yml
# The safety net that keeps the public repo pristine. Runs the same cleanliness
# scan the /alamod-publish skill runs locally — so even a hand-made push that
# bypasses the skill will FAIL loudly if it introduces Cyrillic, secrets, or
# denylisted paths. Wording checks run privately before push, never in this public CI.
name: Cleanliness Guard

on:
  push:
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan working tree (Cyrillic / secrets / denylisted paths)
        run: bash .github/scripts/scan-clean.sh .
