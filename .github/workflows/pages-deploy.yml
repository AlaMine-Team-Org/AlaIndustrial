# Deploy the Ala Industrial guide site (site/) to GitHub Pages.
# Source of truth: the static build generated by docs/tools/gen_guide_site.py in
# the private repo, copied here as a ready artifact. Pages serves the content of
# site/ at the repository's Pages URL.
name: Deploy Guide Site to Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'data/**'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent Pages deployment; cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Download stats (data/stats.json, written by stats.yml) are served next to
      # the site, but must not be COMMITTED inside site/: the wiki publish flow
      # mirrors that directory with `robocopy /MIR` and would delete them, and the
      # site's stale gate would report them as drift. Copying them in here keeps
      # site/ byte-identical to what the generator produces.
      - name: Add stats data to the artifact
        run: |
          if [ -f data/stats.json ]; then
            mkdir -p site/data
            cp data/stats.json site/data/stats.json
            echo "stats.json added ($(wc -c < data/stats.json) bytes)"
          else
            echo "no data/stats.json yet — the site hides the block on its own"
          fi

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
