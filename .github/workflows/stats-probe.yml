# Temporary probe: can the existing CurseForge publishing token read project data?
# Prints HTTP statuses and response shapes only — never the token itself.
# Delete this workflow once the answer is known.
name: Stats probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Try the CurseForge endpoints
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request

          token = os.environ.get("CURSEFORGE_TOKEN", "")
          print("token present:", bool(token), "| length:", len(token))
          UA = "Ma3auka/AlaIndustrial-stats (+https://github.com/AlaMine-Team-Org/AlaIndustrial)"

          def probe(label, url, headers):
              req = urllib.request.Request(url, headers={"User-Agent": UA, **headers})
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      raw = resp.read().decode("utf-8", "replace")
                      print(f"{label}: HTTP {resp.status} | {raw[:220]}")
              except urllib.error.HTTPError as exc:
                  print(f"{label}: HTTP {exc.code} | {exc.read().decode('utf-8', 'replace')[:160]}")
              except Exception as exc:                      # noqa: BLE001 - probe only
                  print(f"{label}: {type(exc).__name__} {exc}")

          # A. Core read API, the header it documents.
          probe("core/x-api-key", "https://api.curseforge.com/v1/mods/1597723",
                {"x-api-key": token, "Accept": "application/json"})
          # B. Same endpoint, the upload API's header — in case the token doubles up.
          probe("core/X-Api-Token", "https://api.curseforge.com/v1/mods/1597723",
                {"X-Api-Token": token, "Accept": "application/json"})
          # C. Upload API — confirms the token itself is valid and what it is good for.
          probe("upload/game-versions", "https://minecraft.curseforge.com/api/game/versions",
                {"X-Api-Token": token})
          PY
