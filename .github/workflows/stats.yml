# Collect download statistics for the guide site once a day.
#
# Neither Modrinth nor CurseForge exposes a public day-by-day history, so the
# history is this file: one cumulative snapshot per day in data/stats.json, which
# the site turns into the chart on its front page.
#
# data/stats.json deliberately lives OUTSIDE site/ — the wiki publish flow mirrors
# site/ with `robocopy /MIR`, which deletes anything the private repo does not
# have, and the site's stale gate treats extra files in site/ as drift.
# pages-deploy.yml copies the file into the Pages artifact at deploy time.
name: Stats

on:
  schedule:
    # 00:37 UTC — just after midnight, so the counters read here are what the day
    # that just ended closed with; fetch-stats.py dates the row with YESTERDAY.
    # It used to run at 04:17 and date the row with the current day, which put
    # yesterday's downloads under today's label on the chart.
    # :37 and not :00 — scheduled runs queue globally and drift the most at the
    # top of the hour. Drift here is harmless: it moves away from midnight, so
    # the row still lands on the same day either way.
    - cron: '37 0 * * *'
  workflow_dispatch:

permissions:
  contents: write      # commit the snapshot
  actions: write       # trigger the Pages deploy below

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect snapshot
        env:
          # Optional. Without it the script falls back to the keyless cfwidget
          # mirror; the plain Modrinth totals need no key at all.
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          # Used only to recover the days that predate the first snapshot, via the
          # Modrinth analytics endpoint. Without it the series simply starts
          # with yesterday.
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python .github/scripts/fetch-stats.py --out data/stats.json

      - name: Commit if changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no change — nothing to commit"
          else
            git commit -m "chore(stats): daily download snapshot [skip ci]"
            git push
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish updated data to Pages
        # A push made with GITHUB_TOKEN does not start other workflows, so the
        # deploy has to be asked for explicitly — workflow_dispatch is one of the
        # few events that token may raise.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSHED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          # `--ref main` is resolved on GitHub's side, and right after a push that
          # can still answer with the PREVIOUS tip: the deploy then ships an older
          # data/stats.json and the site sits a day stale until something else
          # deploys. That is exactly what happened on 2026-08-14 (deploy #40 ran
          # green on aabbf1c, the commit before the snapshot). So wait until the
          # branch is visibly at the commit we just pushed.
          for attempt in $(seq 1 15); do
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            if [ "$head" = "$PUSHED_SHA" ]; then
              gh workflow run pages-deploy.yml --ref main
              echo "dispatched deploy for $PUSHED_SHA"
              exit 0
            fi
            echo "main still reads $head, waiting for $PUSHED_SHA ($attempt/15)"
            sleep 4
          done
          echo "::error::main never caught up with $PUSHED_SHA — deploy not dispatched"
          exit 1
